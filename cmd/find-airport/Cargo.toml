[package]
name = "find-airport"
version = "0.2.1"
edition = "2024"
authors = ["Ollivier Robert <ollivier.robert@eurocontrol.int>"]
description = "Fetch OurAirports data into Parquet, and search it."
readme = "README.md"
license = "MIT"
repository = "https://github.com/keltia/fetiche-rs"
categories = ["aerospace", "command-line-utilities"]
keywords = ["opendata", "airport", "aeronautical-data"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
linker_messages = "allow"

[badges]
maintenance = { status = "actively-developed" }

[[bench]]
name = "bycountry"
harness = false

[[bench]]
name = "deserialize"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap.workspace = true
csv.workspace = true
eyre.workspace = true
fetiche-common.workspace = true
fetiche-macros.workspace = true
futures.workspace = true
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tabled.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

farben = "0.20"
pluscodes = "0.5"
polars-core = { version = "0.55", default-features = false }
polars-io = { version = "0.55", default-features = false, features = ["csv", "parquet"] }
# Polars 0.55 string expressions import polars-time through the temporal feature.
polars-lazy = { version = "0.55", default-features = false, features = ["parquet", "regex", "streaming", "strings", "temporal"] }
polars-utils = { version = "0.55", default-features = false }
rayon = "1.12"

[dev-dependencies]
divan = "0.1"
itertools.workspace = true
rstest.workspace = true
