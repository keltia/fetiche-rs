[package]
name = "import-data"
version = "0.2.0"
edition = "2024"
authors = ["Ollivier Robert <ollivier.robert@eurocontrol.int>"]
description = "CLI utility to import data into CH."
readme = "README.md"
license = "MIT"
repository = "https://github.com/keltia/fetiche-rs"
categories = ["aerospace", "command-line-utilities"]
keywords = ["adsb", "aeronautical-data"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono.workspace = true
clap.workspace = true
csv.workspace = true
eyre.workspace = true
fetiche-common.workspace = true
fetiche-macros.workspace = true
futures.workspace = true
jiff.workspace = true
polars.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tabled.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

cached = { version = "0.59", features = ["async", "async_tokio_rt_multi_thread"] }
klickhouse = { version = "0.14", features = ["derive", "geo-types", "serde", "bb8"] }
regex = "1.12"
tinytemplate = "1.2"

[dev-dependencies]
divan = "0.1"
itertools.workspace = true
rstest.workspace = true
