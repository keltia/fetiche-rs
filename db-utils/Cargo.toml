[package]
name = "db-utils"
description = "Utilities used as Clickhouse UDF."
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "compute-height"
path = "src/compute-height.rs"
test = false
bench = false

[[bin]]
name = "compute-localtime"
path = "src/compute-localtime.rs"
test = false
bench = false

[dependencies]
eyre.workspace = true
jiff.workspace = true

egm2008 = "0.1"
stderrlog = "0.6"
log = "0.4"
clap = { version = "4.5.40", features = ["derive"] }
