[package]
name = "fetiche-engine"
version = "0.26.0"
edition = "2024"
authors = ["Ollivier Robert <ollivier.robert@eurocontrol.int>"]
description = "Engine component for the Fetiche framework."
readme = "README.md"
license = "MIT"
repository = "https://github.com/keltia/fetiche-rs"
categories = ["aerospace::drones"]
keywords = ["drones", "aeronautical-data", "ads-b"]

[features]
default = ["asd", "senhive", "avionix", "aeroscope", "flightaware"]
privacy = []
json = []

aeroscope = []
asd = []
avionix = ["tokio/net"]
flightaware = ["base64_light", "tokio-native-tls"]
opensky = ["mini-moka"]
safesky = []
senhive = ["polars-io/json"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[bench]]
name = "read"
harness = false

[[bench]]
name = "timestamp"
harness = false

[[bench]]
name = "rotation"
harness = false

[[bench]]
name = "json_to"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bon.workspace = true
clap.workspace = true
csv.workspace = true
eyre.workspace = true
fetiche-common.workspace = true
fetiche-formats.workspace = true
fetiche-macros.workspace = true
futures.workspace = true
hcl-rs.workspace = true
jiff.workspace = true
nom.workspace = true
object_store.workspace = true
ractor.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tabled.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

enum_dispatch = "0.3"
humantime = "2.4"
lapin = { version = "4.13", features = ["native-tls"] }
native-tls = "0.2"
polars-core = { version = "0.55", default-features = false }
polars-io = { version = "0.55", default-features = false, features = ["csv", "parquet"] }
futures-util = "0.3"
regex = "1.13"

base64_light = { version = "0.1", optional = true }
mini-moka = { version = "0.10", optional = true }
tokio-native-tls = { version = "0.3", optional = true }

[dev-dependencies]
criterion.workspace = true
ctrlc.workspace = true
directories.workspace = true
indicatif.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-std"] }

base64_light = "0.1"
dateparser = "0.3"
divan = "0.1"
polars-io = { version = "0.55", default-features = false, features = ["json"] }
test-pretty-log = "0.6"
tracing-subscriber = "0.3"
