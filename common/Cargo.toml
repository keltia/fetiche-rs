[package]
name = "fetiche-common"
version = "0.4.4"
edition = "2024"
authors = ["Ollivier Robert <ollivier.robert@eurocontrol.int>"]
description = "Common library for fetiche modules."
readme = "README.md"
license = "MIT"
repository = "https://github.com/keltia/fetiche-rs"
categories = ["aerospace::drones"]
keywords = ["drones", "aeronautical-data", "airplanes"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
linker_messages = "allow"

[badges]
maintenance = { status = "actively-developed" }

[[bench]]
name = "date_bench"
harness = false

[[bench]]
name = "expand"
harness = false

[[bench]]
name = "div_expand"
harness = false

[[bench]]
name = "date_parsing"
harness = false

[[bench]]
name = "ser"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
telemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]
console = ["dep:console-subscriber"]

[dependencies]
chrono.workspace = true
clap.workspace = true
csv.workspace = true
dateparser.workspace = true
directories.workspace = true
eyre.workspace = true
fetiche-macros.workspace = true
hcl-rs.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tabled.workspace = true
thiserror.workspace = true
tracing.workspace = true

ctrlc = { version = "3.5", features = ["termination"] }
enum_dispatch = "0.3"
humantime = "2.4"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "time", "tracing"] }
tracing-tree = { version = "0.4", features = ["time"] }
tzf-rs = "1.3"

console-subscriber = { version = "0.5", optional = true }

opentelemetry = { version = "0.32", features = ["logs", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
criterion.workspace = true
polars.workspace = true
proptest.workspace = true
ractor.workspace = true
rstest.workspace = true
tokio.workspace = true

datafusion = "54"
divan = "0.1"
polars-io = "0.54"
rand = "0.10"
test-pretty-log = "0.6"
uuid = { version = "1.23", features = ["serde", "v7"] }
